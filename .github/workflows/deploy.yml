name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # What goes live on estiak.me. Keep "legacy" (the 2022 site in legacy/) while the
  # revamp is in progress; switch to "astro" at cutover.
  DEPLOY_TARGET: legacy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage legacy site
        if: env.DEPLOY_TARGET == 'legacy'
        run: |
          mkdir _site
          cp -R legacy/. _site/
          cp public/CNAME _site/CNAME
          touch _site/.nojekyll
      - if: env.DEPLOY_TARGET == 'legacy'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - if: env.DEPLOY_TARGET == 'astro'
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
